# ChimeraCrypto nginx configuration
# Place this file in /etc/nginx/sites-available/chimera
# Enable with: sudo ln -s /etc/nginx/sites-available/chimera /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 9443 ssl http2;
    server_name _;
    
    # SSL Configuration
    # Replace these paths with your actual certificate locations
    ssl_certificate /etc/ssl/certs/chimera.crt;
    ssl_certificate_key /etc/ssl/private/chimera.key;
    
    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Static files served from gui directory
    # DEPLOY: update this to match your actual home directory
    # Run: sed -i "s|CHIMERA_GUI_ROOT|$HOME/ChimeraCrypto/gui|g" /etc/nginx/sites-available/chimera
    root CHIMERA_GUI_ROOT;
    index index.html;
    
    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1000;
    
    # Serve static GUI files
    location / {
        try_files $uri $uri/ =404;

        # HTML + JS: never cache — always fetch latest on reload
        location ~* \.(html|js)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Images/icons: cache 1 day
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1d;
            add_header Cache-Control "public";
        }
    }

    # API: never cache
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
    
    # WebSocket proxy to Chimera backend
    location /ws {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        
        # Required WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# Optional: Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host:9443$request_uri;
}
