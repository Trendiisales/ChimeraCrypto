<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chimera — Tier-2 Edges</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root {
    --bg: #0a0e15;
    --panel: #111722;
    --panel-2: #161e2c;
    --line: #1e2738;
    --text: #cfd5e1;
    --dim: #6f7a8c;
    --accent: #4ad6c5;
    --green: #3ce088;
    --red: #ff5d7a;
    --amber: #f8b94c;
    --shadow: 0 1px 0 #1e2738, 0 8px 24px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  body { padding: 16px 22px; }
  header {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: 8px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  }
  header .logo { font-weight: 900; letter-spacing: 0.18em; font-size: 22px; color: var(--accent); }
  header .sub  { font-size: 12px; color: var(--dim); letter-spacing: 0.10em; text-transform: uppercase; }
  header .build { margin-left: auto; font-size: 11px; color: var(--dim); }
  header .kill {
    background: transparent; border: 1px solid var(--red); color: var(--red);
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px;
  }
  header .kill:hover { background: var(--red); color: #0a0e15; }

  /* ── Live spot-price strip — current pricing for all 8 feed symbols ─── */
  .ticker {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    margin-bottom: 18px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: var(--shadow);
  }
  .tile {
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 10px;
    border-right: 1px solid var(--line);
  }
  .tile:last-child { border-right: none; }
  .tile.engine-symbol { background: rgba(74,214,197,0.04); border-radius: 4px; }
  .tile .sym {
    font-size: 10px; letter-spacing: 0.12em; color: var(--dim);
    text-transform: uppercase; font-weight: 700;
  }
  .tile.engine-symbol .sym { color: var(--accent); }
  .tile .px  {
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--text); letter-spacing: -0.01em;
  }
  .tile.no-data .px { color: var(--dim); font-weight: 400; }
  .tile .px.up   { color: var(--green); }
  .tile .px.down { color: var(--red);   }
  .tile .tag {
    font-size: 9px; color: var(--dim); letter-spacing: 0.08em;
    text-transform: uppercase; margin-top: 1px;
  }
  .tile.engine-symbol .tag { color: var(--accent); opacity: 0.8; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 14px;
  }

  .engine {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .engine.in-position { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent) inset; }
  .engine.halted      { border-color: var(--red); opacity: 0.7; }

  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tag { font-weight: 800; letter-spacing: 0.1em; font-size: 14px; color: #e8edf5; }
  .symbol-row { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .pill {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); letter-spacing: 0.08em; text-transform: uppercase;
  }
  .pill.shadow { color: var(--amber); border-color: rgba(248,185,76,0.35); background: rgba(248,185,76,0.08); }
  .pill.live   { color: var(--green); border-color: rgba(60,224,136,0.35); background: rgba(60,224,136,0.08); }
  .pill.armed  { color: var(--accent); border-color: rgba(74,214,197,0.35); background: rgba(74,214,197,0.08); }
  .pill.intrade{ color: #0a0e15; background: var(--accent); border-color: var(--accent); }
  .pill.halted { color: var(--red); border-color: rgba(255,93,122,0.35); background: rgba(255,93,122,0.10); }

  /* Big "current price" line on each engine card */
  .spot-row {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-top: 10px; padding: 8px 10px;
    background: var(--panel-2); border-radius: 4px;
    border: 1px solid var(--line);
  }
  .spot-row .lbl { font-size: 10px; color: var(--dim); letter-spacing: 0.10em; text-transform: uppercase; }
  .spot-row .px  { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .spot-row .px.up   { color: var(--green); }
  .spot-row .px.down { color: var(--red);   }
  .spot-row.no-data .px { color: var(--dim); font-weight: 500; }

  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px 14px;
    margin-top: 12px;
  }
  .metric { display: flex; flex-direction: column; gap: 2px; }
  .metric .lbl { font-size: 10px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .metric .val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .dim { color: var(--dim); }

  .trade-row {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
  }
  .trade-row .price { color: var(--text); font-variant-numeric: tabular-nums; }

  footer {
    margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--dim);
  }
  .ok    { color: var(--green); }
  .stale { color: var(--amber); }
  .down  { color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">CHIMERA</div>
  <div class="sub">Tier-2 Edges</div>
  <div class="build" id="build">build —</div>
  <button class="kill" id="killAll" title="Force-flatten every paper position and halt all engines">Kill All</button>
</header>

<!-- Live spot-price strip — populated from /api/state2 spot_prices on every poll -->
<div class="ticker" id="ticker"></div>

<div class="grid" id="engines"></div>

<footer>
  <div id="status">Connecting...</div>
  <div id="lastUpdated">—</div>
</footer>

<script>
  // Symbol metadata: display order, short name, which engine (if any) trades it.
  // Order matches SymbolIndex.hpp on the backend.
  const SYMBOLS = [
    { full: 'btcusdt',  short: 'BTC',  engineTag: 'BTC-TSMOM-D1' },
    { full: 'ethusdt',  short: 'ETH',  engineTag: 'ETH-BB-H6'    },
    { full: 'solusdt',  short: 'SOL',  engineTag: 'SOL-DONCH-H6' },
    { full: 'bnbusdt',  short: 'BNB',  engineTag: null           },
    { full: 'avaxusdt', short: 'AVAX', engineTag: null           },
    { full: 'linkusdt', short: 'LINK', engineTag: 'LINK-RSI-H6'  },
    { full: 'xrpusdt',  short: 'XRP',  engineTag: 'XRP-DONCH-H1' },
    { full: 'dogeusdt', short: 'DOGE', engineTag: null           },
  ];

  // Hold previous tick price per symbol so we can colour up/down moves.
  const prevPx = Object.create(null);

  const $ = (sel) => document.querySelector(sel);
  const fmtBp  = (v) => (v == null || isNaN(v)) ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(1) + 'bp';
  const fmtInt = (v) => (v == null || isNaN(v)) ? '—' : Number(v).toString();
  const wrPct  = (w, t) => (!t || t === 0) ? '—' : (100 * w / t).toFixed(0) + '%';

  // Format a price with a reasonable number of decimals depending on magnitude.
  // BTC ~60000 -> 2dp, XRP ~2.50 -> 4dp, DOGE ~0.15 -> 5dp.
  function fmtPx(v) {
    if (v == null || isNaN(v) || v <= 0) return '—';
    const n = Number(v);
    if (n >= 1000)  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (n >= 10)    return n.toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 3 });
    if (n >= 1)     return n.toFixed(4);
    if (n >= 0.01)  return n.toFixed(5);
    return n.toFixed(6);
  }

  function pxClass(symFull, newPx) {
    const old = prevPx[symFull];
    if (old == null || newPx == null || newPx <= 0 || old <= 0) return '';
    if (newPx > old) return 'up';
    if (newPx < old) return 'down';
    return '';
  }

  function renderTicker(spotPrices) {
    spotPrices = spotPrices || {};
    return SYMBOLS.map(s => {
      const px = spotPrices[s.full];
      const has = (px != null && !isNaN(px) && px > 0);
      const tileClass = [
        'tile',
        s.engineTag ? 'engine-symbol' : '',
        has ? '' : 'no-data',
      ].filter(Boolean).join(' ');
      const pc = has ? pxClass(s.full, px) : '';
      const tagLine = s.engineTag ? s.engineTag : 'spot';
      return `
        <div class="${tileClass}">
          <div class="sym">${s.short}</div>
          <div class="px ${pc}">${has ? fmtPx(px) : '—'}</div>
          <div class="tag">${tagLine}</div>
        </div>
      `;
    }).join('');
  }

  function renderEngine(e, spotPrices) {
    spotPrices = spotPrices || {};
    const inPos = !!e.in_position;
    const halted = !!e.halted;
    const klass = halted ? 'engine halted' : (inPos ? 'engine in-position' : 'engine');
    const stateClass = halted ? 'halted' : (inPos ? 'intrade' : (e.shadow ? 'shadow' : 'live'));
    const stateText  = halted ? 'Halted' : (inPos ? 'In Trade' : (e.shadow ? 'Shadow' : 'Live'));
    const totalClass = (e.total_bp || 0) > 0 ? 'val pos' : ((e.total_bp || 0) < 0 ? 'val neg' : 'val');
    const lastClass  = (e.last_bp  || 0) > 0 ? 'val pos' : ((e.last_bp  || 0) < 0 ? 'val neg' : 'val');

    // Current price for this engine — prefer live spot tick, fall back to
    // engine bar-aggregated last_close (only useful once first bar has closed).
    const symKey = (e.symbol || '').toLowerCase();
    const spotPx = spotPrices[symKey];
    const livePx = (spotPx != null && spotPx > 0) ? spotPx : (e.last_close > 0 ? e.last_close : null);
    const hasLive = (livePx != null && livePx > 0);
    const livePxClass = hasLive ? pxClass(symKey, livePx) : '';

    const tfLabel = (() => {
      const s = e.tf_secs || 0;
      if (s === 3600)  return 'H1';
      if (s === 7200)  return 'H2';
      if (s === 14400) return 'H4';
      if (s === 21600) return 'H6';
      if (s === 86400) return 'D1';
      return (s / 3600).toFixed(1) + 'h';
    })();
    return `
      <div class="${klass}">
        <div class="row">
          <div>
            <div class="tag">${e.tag || '—'}</div>
            <div class="symbol-row">${(e.symbol || '').toUpperCase()} &nbsp;·&nbsp; ${e.strategy || ''} &nbsp;·&nbsp; ${tfLabel}</div>
          </div>
          <div class="pill ${stateClass}">${stateText}</div>
        </div>

        <div class="spot-row ${hasLive ? '' : 'no-data'}">
          <div class="lbl">Live Price</div>
          <div class="px ${livePxClass}">${hasLive ? fmtPx(livePx) : '—'}</div>
        </div>

        <div class="metrics">
          <div class="metric"><div class="lbl">Total Net</div><div class="${totalClass}">${fmtBp(e.total_bp)}</div></div>
          <div class="metric"><div class="lbl">Last Trade</div><div class="${lastClass}">${fmtBp(e.last_bp)}</div></div>
          <div class="metric"><div class="lbl">Trades</div><div class="val">${fmtInt(e.trades)}</div></div>
          <div class="metric"><div class="lbl">Win Rate</div><div class="val">${wrPct(e.wins, e.trades)}</div></div>
          <div class="metric"><div class="lbl">Last Close</div><div class="val">${fmtPx(e.last_close)}</div></div>
          <div class="metric"><div class="lbl">Wins</div><div class="val">${fmtInt(e.wins)}</div></div>
          <div class="metric"><div class="lbl">Bars Buf</div><div class="val">${fmtInt(e.bars_in_buffer)}</div></div>
          <div class="metric"><div class="lbl">Mode</div><div class="val">${e.shadow ? 'shadow' : 'live'}</div></div>
        </div>

        ${inPos ? `
        <div class="trade-row">
          OPEN @ <span class="price">${fmtPx(e.entry_px)}</span>
          &nbsp;·&nbsp; SL @ <span class="price">${fmtPx(e.sl_px)}</span>
        </div>` : ''}
      </div>
    `;
  }

  let lastFetchOk = 0;

  async function refresh() {
    const status = $('#status');
    try {
      const r = await fetch('/api/state2', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();

      const spot = j.spot_prices || {};

      $('#build').textContent = 'build ' + (j.build || '—');
      $('#ticker').innerHTML  = renderTicker(spot);
      $('#engines').innerHTML = (j.engines || []).map(e => renderEngine(e, spot)).join('');

      // Update prevPx AFTER render so the up/down colouring is "since last poll".
      SYMBOLS.forEach(s => {
        const px = spot[s.full];
        if (px != null && !isNaN(px) && px > 0) prevPx[s.full] = px;
      });

      lastFetchOk = Date.now();
      status.textContent = 'Live';
      status.className = 'ok';
      $('#lastUpdated').textContent = new Date().toLocaleTimeString();
    } catch (err) {
      const age = lastFetchOk ? Math.round((Date.now() - lastFetchOk) / 1000) : null;
      if (age != null && age < 10) {
        status.textContent = 'Stale (' + age + 's)';
        status.className = 'stale';
      } else {
        status.textContent = 'Disconnected — ' + err.message;
        status.className = 'down';
      }
    }
  }

  $('#killAll').addEventListener('click', async () => {
    if (!confirm('Kill all engines? This will flatten every open paper position and halt new entries.')) return;
    try {
      const r = await fetch('/api/kill', { method: 'POST' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      alert('Kill sent.');
      refresh();
    } catch (err) {
      alert('Kill failed: ' + err.message);
    }
  });

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
